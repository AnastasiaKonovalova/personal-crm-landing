# Landing part of the nginx site config for mypeoplecrm.ru, kept here for history.
# The live file on the server also has blocks owned by other projects; they are not copied here.
# After changing the landing blocks on the server, update this copy and commit.
# Certificate: certbot (webroot), renewal reloads nginx.

# HTTP: ACME challenges for certbot, everything else redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mypeoplecrm.ru app.mypeoplecrm.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Landing: static files uploaded by the deploy workflow.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mypeoplecrm.ru;

    ssl_certificate /etc/letsencrypt/live/mypeoplecrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypeoplecrm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/landing;
    index index.html;

    # Also off globally in nginx.conf; repeated so the landing does not depend on it.
    server_tokens off;

    # Security headers. A location with its own add_header drops these, so keep them here only.
    # HSTS for one year; certbot renewal verified with a dry run before enabling it.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Astro inlines styles and scripts into the page, so 'unsafe-inline' is allowed; everything else is self only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
}
